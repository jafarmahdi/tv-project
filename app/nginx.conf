server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    resolver ${WATCHLOG_DNS_RESOLVER} valid=30s ipv6=off;

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm font/woff2;

    # Resolve the API service at request time so a brief DNS hiccup during container start
    # doesn't crash the whole pod; the startup script injects the pod's own resolver IP.
    set $watchlog_api http://watchlog-api.watchlog.svc.cluster.local;

    # Flutter's own assets are content-hashed by the build — cache them hard.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # nginx's bundled mime.types doesn't map .wasm — without this, browsers that require a
    # correct application/wasm Content-Type for streaming instantiation fall back to a slower
    # path (or fail outright), defeating the point of the --wasm build (see app/Dockerfile).
    # No long-lived caching here: unlike /assets/, main.dart.wasm keeps the same filename across
    # builds (it isn't content-hashed), so aggressively caching it would serve stale app code
    # after every deploy.
    location ~ \.wasm$ {
        default_type application/wasm;
        add_header Cache-Control "no-cache";
    }

    # Reverse-proxy API calls to the backend over the cluster's internal DNS, so the
    # app is built with a *relative* API_BASE_URL (see app_config.dart) and every request
    # goes back to whatever origin the page itself was loaded from — hostname, LAN IP,
    # HTTP or HTTPS. That's what lets the same build work from a browser that trusts the
    # internal CA (api.watchlog.lab) and from a device that doesn't (plain IP, no cert).
    location /api/ {
        proxy_pass $watchlog_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SignalR — needs the WebSocket upgrade headers forwarded and long timeouts.
    location /hubs/ {
        proxy_pass $watchlog_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Everything else falls back to index.html so go_router's client-side
    # routing (e.g. a hard refresh on /movie/550) resolves correctly.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
