## Local/dev stack for WatchLog. Run from the repo root:
##   cp .env.example .env   # then fill in a real TMDB key etc.
##   docker compose --env-file .env -f infra/docker-compose.yml up --build
name: watchlog

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-watchlog}
      POSTGRES_USER: ${POSTGRES_USER:-watchlog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-watchlog}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-watchlog}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      # Override the .env host names (which target `localhost` for bare-metal dev) with the
      # in-network service names docker-compose gives each container.
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB:-watchlog};Username=${POSTGRES_USER:-watchlog};Password=${POSTGRES_PASSWORD:-watchlog}
      ConnectionStrings__Redis: redis:6379
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ../app
      dockerfile: Dockerfile
      args:
        # Same-origin: nginx below proxies /api, /hubs, /health, /swagger to `api` and everything
        # else to this container, so the Flutter app can just call relative paths.
        API_BASE_URL: ""
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8081}:80"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web

volumes:
  postgres-data:
  redis-data:
