worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # In production, terminate TLS here (add a `listen 443 ssl;` server block with your
    # certificate) and redirect plain :80 traffic to it. Kept HTTP-only for local dev.
    upstream watchlog_api {
        server api:8080;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 20m;

        location / {
            proxy_pass http://watchlog_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # SignalR needs long-lived connections upgraded to WebSocket.
        location /hubs/ {
            proxy_pass http://watchlog_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }
    }
}
