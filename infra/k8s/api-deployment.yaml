apiVersion: apps/v1
kind: Deployment
metadata:
  name: watchlog-api
  namespace: watchlog
  labels:
    app: watchlog-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: watchlog-api
  template:
    metadata:
      labels:
        app: watchlog-api
    spec:
      # Uncomment if `ghcr.io/jafarmahdi/tv-project-api` stays private.
      # imagePullSecrets:
      #   - name: ghcr-creds
      containers:
        - name: api
          image: ghcr.io/jafarmahdi/tv-project-api:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: watchlog-api-config
            - secretRef:
                name: watchlog-api-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 20
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 20
            failureThreshold: 18
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: watchlog-api
  namespace: watchlog
spec:
  selector:
    app: watchlog-api
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
