apiVersion: apps/v1
kind: Deployment
metadata:
  name: watchlog-web
  namespace: watchlog
  labels:
    app: watchlog-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: watchlog-web
  template:
    metadata:
      labels:
        app: watchlog-web
    spec:
      # Uncomment if `ghcr.io/jafarmahdi/tv-project-web` stays private.
      # imagePullSecrets:
      #   - name: ghcr-creds
      containers:
        - name: web
          image: ghcr.io/jafarmahdi/tv-project-web:latest # built from app/Dockerfile, same publish flow as the API image
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: watchlog-web
  namespace: watchlog
spec:
  selector:
    app: watchlog-web
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
